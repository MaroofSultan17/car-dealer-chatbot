[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "car-dealer-chatbot"
version = "0.1.0"
description = "LLM-powered chatbot for finding cars and connecting users with dealers"
requires-python = ">=3.12,<3.13"

dependencies = [
    "google-genai==1.41.0",
    "pandas==2.3.3",
    "pydantic==2.12.0",
    "python-dotenv==1.1.1",
    "streamlit==1.50.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]