[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "car-dealer-chatbot"
version = "0.1.0"
description = "LLM-powered chatbot for finding cars and connecting users with dealers"
requires-python = ">=3.11"

dependencies = [
    "google-genai==1.41.0",
    "pandas==2.3.3",
    "python-dotenv==1.1.1",
    "streamlit==1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100