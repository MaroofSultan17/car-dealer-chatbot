services:
  api:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
